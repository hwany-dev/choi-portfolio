<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f0f0" />
    <title>Eunji Choi — Brand Experience Strategist</title>
    <meta name="description" content="Eunji Choi — Brand Experience Strategist" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eunji Choi — Brand Experience Strategist" />
    <meta property="og:description" content="Eunji Choi — Brand Experience Strategist" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Invert color: FOUC 방지 — React 마운트 전에 html[data-inverted] 세팅.
         키·색상은 src/hooks/useTheme.ts 와 동일하게 유지할 것 */
      (function () {
        var inverted = false
        try {
          var saved = localStorage.getItem('invert-color')
          inverted = saved === null ? matchMedia('(prefers-color-scheme: dark)').matches : saved === '1'
        } catch (e) {}
        if (inverted) document.documentElement.setAttribute('data-inverted', '')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', inverted ? '#0e0e0e' : '#f0f0f0')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
